schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Язык: все артефакты и спеки пишутся ТОЛЬКО на русском языке.
  Заголовки, описания, требования (Requirement), сценарии (Scenario), задачи,
  комментарии в спеках — всё на русском. Технические идентификаторы
  (имена файлов, код, пути, название change) остаются на английском.
  Tech stack: Flutter (Dart), web

rules:
  proposal:
    - Весь текст proposal.md — только на русском языке
  design:
    - Весь текст design.md — только на русском языке
  tasks:
    - Весь текст tasks.md — только на русском языке
  spec:
    - ADRs, Requirements и Scenarios в дельта-спеках — только на русском языке

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
